# KnowledgeOS dispatch policy.
# Lifecycle is fixed; capability selection is policy-driven and observable.
dispatch_policy:
  default_order:
    - branch_builder
    - orchestrator
    - subagent
    - mcp
    - skill
    - script
    - human_gate

  always_consult_before:
    - execute
    - complete

  consult_for_risks:
    - external_write
    - release
    - destructive_change
    - security_review_before_release

  human_gate_for:
    - browser_automation
    - private_account_access
    - external_write
    - release
    - destructive_change

  branch_builder_task_types:
    - capability_orchestration
    - route_bound_execution_guard
    - executable_control_plane
    - workflow_routing
    - tool_registry
    - engineering_change
    - research_task
    - knowledge_structuring

  subagent_task_types:
    - capability_orchestration
    - executable_control_plane
    - engineering_change
    - security_audit
    - architecture_design

  mcp_task_types:
    - capability_orchestration
    - research_task
    - knowledge_structuring
    - documentation_task
    - release_task

  skill_task_types:
    - capability_orchestration
    - knowledge_structuring
    - report_task
    - documentation_task
    - engineering_change

  script_task_types:
    - executable_control_plane
    - route_bound_execution_guard
    - capability_orchestration
    - engineering_eval
