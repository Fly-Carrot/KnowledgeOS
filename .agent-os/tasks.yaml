      - "verify-lifecycle blocks missing dispatch or required capability trace"
      - "doctor unit tests scenarios and diff check pass"
  - id: KOS-T032
    title: "Productize Workbench Phase 1 shell"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "product_shell_boundary"
    outputs:
      - "examples/workbench/"
      - "apps/workbench/"
      - "tests/test_workbench_static.py"
      - "docs/workbench-runtime-adapters.md"
      - ".agent-os/tasks.yaml"
