      - "About/product version and read-only safety are visible"
      - "Electron shell and docs use product language while preserving read-only bridge"
      - "doctor, unit tests, guardrail scenarios, smoke, diagnose, and browser checks pass"
  - id: KOS-T033
    title: "Build Workbench Phase 2 app windows"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "workbench_interaction_boundary"
    outputs:
      - "examples/workbench/"
      - "apps/workbench/"
      - "tests/test_workbench_static.py"
