      - "postflight-required projects resolve an executable after-task hook"
      - "managed project mount repair can run as dry-run before apply"
      - "doctor and tests pass"
  - id: KOS-T028
    title: "Retire legacy Antigravity Skills root"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "destructive_cleanup"
    outputs:
      - "docs/LIVE-REPORT.md"
      - ".agent-os/tasks.yaml"
    acceptance:
      - "all active project configs stop pointing to the legacy pre-OS skills root"
      - "legacy pre-OS skills directory is removed after dependency scan"
      - "KnowledgeOS doctor and smoke tests pass"
  - id: KOS-T029
    title: "Restore governance kernel boot skeleton"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "boot_regression"
    outputs:
