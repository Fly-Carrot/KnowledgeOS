      - "doctor, unit tests, guardrail scenarios, smoke, diagnose, and browser checks pass"
  - id: KOS-T034
    title: "Add operational trace and orchestrator adapter spec"
    type: "capability_orchestration"
    status: completed
    complexity: "medium"
    risk: "guardrail_regression"
    outputs:
