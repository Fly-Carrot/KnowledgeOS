tasks:
  - id: KOS-T001
    title: Create safe KnowledgeOS skeleton
    type: os_scaffold
    status: in_progress
    outputs:
      - README.md
      - docs/LIVE-REPORT.md
      - .agent-os/
      - templates/
    acceptance:
      - public and local tracks are separated
      - live report is created
      - no local secrets are copied

  - id: KOS-T002
    title: Inventory existing Agent Shared Fabric workflow
    type: migration_inventory
    status: ready
    inputs:
      - templates/governance-core
      - templates/capability-layer
    outputs:
      - .knowledgeos-local/inventory/current-workflow.md
    acceptance:
      - kernel module and capability layer are listed separately
      - MCP, skills, workflows, and Branch Builder are summarized
      - secrets are referenced only as env or presence checks

  - id: KOS-T003
    title: Define project template contract
    type: template_design
    status: backlog
    outputs:
      - templates/project-control-plane/
    acceptance:
      - workspace/project/task/eval/artifact schemas are present
      - write policy is included
      - capability policy is included

  - id: KOS-T004
    title: Build executable KnowledgeOS control plane
    type: executable_control_plane
    status: completed
    outputs:
      - knowledgeos/cli.py
      - bin/knowledgeos
      - tests/test_knowledgeos_cli.py
      - docs/executable-control-plane.md
    acceptance:
      - doctor command validates public surface
      - init-project preserves existing files by default
      - check-write classifies controlled, immutable, human-gated, and unclassified paths
      - run-task creates run evidence
      - tests pass

  - id: KOS-T005
    title: Build unified doctor and agent guardrails
    type: deep_validation
    status: completed
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/doctor-guardrails.md
      - docs/agent-guide.md
    acceptance:
      - doctor validates project schema and runtime guardrails
      - unresolved placeholders are detected
      - agent-guide provides a strict onboarding checklist
      - smoke includes unified doctor
      - tests pass

  - id: KOS-T006
    title: Build workflow router skeleton
    type: workflow_routing
    status: completed
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/workflow-router.md
      - .agent-os/workflows/router.yaml
      - templates/project-control-plane/.agent-os/workflows/router.yaml
    acceptance:
      - route-task maps task ids to observable workflow routes
      - unrouted task types require human triage
      - doctor validates that task types have route profiles
      - tests pass

  - id: KOS-T007
    title: Add observable tool registry and orchestration checks
    type: tool_registry
    status: completed
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/tool-registry.md
      - .agent-os/tool-registry.yaml
      - templates/project-control-plane/.agent-os/tool-registry.yaml
    acceptance:
      - tool-registry reports MCP, skills, workflows, orchestrators, and subagents
      - doctor validates tool registry shape and secret hygiene
      - legacy duplicate validation command is removed
      - smoke includes tool registry validation

  - id: KOS-T008
    title: Add route-bound execution guard
    type: route_bound_execution_guard
    status: completed
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/route-bound-execution-guard.md
      - .agent-os/workflows/router.yaml
      - templates/project-control-plane/.agent-os/workflows/router.yaml
      - templates/project-control-plane/AGENTS.md
    acceptance:
      - check-route-write enforces both write policy and route allowed outputs
      - run-task requires routed ready or in-progress tasks
      - complete-task requires passed eval by default
      - doctor validates route eval profiles and allowed outputs
      - smoke and unit tests pass

  - id: KOS-T009
    title: Add capability-oriented orchestration
    type: capability_orchestration
    status: completed
    complexity: complex
    risk: orchestration_policy_review
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/capability-orchestration.md
      - .agent-os/dispatch-policy.yaml
      - .agent-os/tool-registry.yaml
      - .agent-os/evals.yaml
      - .agent-os/tasks.yaml
      - .agent-os/workflows/router.yaml
      - templates/project-control-plane/.agent-os/dispatch-policy.yaml
      - templates/project-control-plane/.agent-os/tool-registry.yaml
      - templates/project-control-plane/AGENTS.md
    acceptance:
      - dispatch-task produces an observable capability plan
      - Branch Builder is prioritized for complex work
      - orchestrator/subagents are considered before MCP and skills
      - agent consultation checkpoints are explicit
      - doctor and smoke tests pass

  - id: KOS-T010
    title: Normalize functional document names and OS capability layer
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: public_structure_cleanup
    outputs:
      - README.md
      - Makefile
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/
      - templates/
      - .agent-os/tasks.yaml
      - .agent-os/workflows/router.yaml
      - .agent-os/workspace.yaml
      - .agent-os/fabric-link.yaml
      - .agent-os/project.yaml
    acceptance:
      - public docs use functional names instead of phase-number names
      - capability layer replaces old body terminology in templates and public copy
      - init-project exposes capability-root while preserving implementation-root compatibility
      - doctor, smoke, and unit tests pass

  - id: KOS-T011
    title: Add minimal runnable KnowledgeOS kernel scaffold
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: kernel_template_purity
    outputs:
      - README.md
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/
      - templates/governance-core/
      - templates/capability-layer/
      - .agent-os/tasks.yaml
      - .agent-os/write-policy.yaml
    acceptance:
      - governance-core includes rules, hooks, registries, schemas, memory lanes, and sync ledgers
      - init-os creates global-agent-fabric and capability-layer from templates
      - generated hooks return BOOT_OK, PHASE_OK, and SYNC_OK in a temp runtime
      - initialized projects can mount the generated kernel and pass doctor
      - public templates remain secret-free and minimal

  - id: KOS-T012
    title: Add concise doctor summary and distracted-agent scenarios
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: guardrail_regression
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - examples/scenarios/
      - README.md
      - Makefile
      - .agent-os/tasks.yaml
      - .agent-os/evals.yaml
      - .agent-os/workflows/router.yaml
      - .agent-os/write-policy.yaml
    acceptance:
      - doctor --summary returns concise pass/fail counts
      - full doctor output remains available by default
      - scenarios create isolated temporary projects
      - distracted-agent mistakes are blocked by doctor, route, write, and eval guards
      - smoke, unit tests, and scenario checkpoints pass

  - id: KOS-T013
    title: Migrate capability layer into KnowledgeOS
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: runtime_link_migration
    inputs:
      - templates/governance-core
      - templates/capability-layer
    outputs:
      - templates/governance-core/
      - templates/capability-layer/
      - .agent-os/fabric-link.yaml
      - .agent-os/workspace.yaml
      - .agent-os/tool-registry.yaml
      - .agent-os/startup-prompt.md
      - AGENTS.md
      - .agent-os/tasks.yaml
      - .agent-os/workflows/router.yaml
      - .agent-os/write-policy.yaml
    acceptance:
      - capability-layer contains mcp, skills, workflows, subagents, agents, and registries
      - capability-layer skills and workflows are copied by capability type
      - full external skill catalogs are not copied and are not active runtime dependencies
      - active KnowledgeOS and Gemini links point to KnowledgeOS paths
      - doctor, tool-registry, unit tests, and guardrail scenarios pass

  - id: KOS-T014
    title: Add cold archive strategy for legacy project leftovers
    type: archive_management
    status: completed
    complexity: medium
    risk: migration_safety
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - docs/archive-policy.md
      - docs/reset-and-migration.md
      - docs/migration-boundary.md
      - docs/executable-control-plane.md
      - docs/agentos-architecture.md
      - .agent-os/read-policy.yaml
      - .agent-os/write-policy.yaml
      - .agent-os/evals.yaml
      - .agent-os/workflows/router.yaml
      - .agent-os/tasks.yaml
      - templates/project-control-plane/.agent-os/read-policy.yaml
      - templates/project-control-plane/.agent-os/write-policy.yaml
      - templates/project-control-plane/.agent-os/workflows/router.yaml
      - templates/project-control-plane/archive/README.md
      - README.md
      - AGENTS.md
    acceptance:
      - archive/** is cold storage and not default context
      - archive-legacy-project writes a review-first plan
      - apply moves only strong candidates or explicit includes
      - existing migration and reset behavior remains unchanged
      - doctor and unit tests pass

  - id: KOS-T015
    title: Harden archive and policy guard robustness
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: guardrail_regression
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - .agent-os/tasks.yaml
    acceptance:
      - policy parser does not leak list items from unknown sections
      - archive explicit includes skip missing paths and project root
      - archive route write checks allow archive root and archive children
      - doctor, smoke, and unit tests pass

  - id: KOS-T016
    title: Add read-only Workbench state interface
    type: executable_control_plane
    status: completed
    complexity: medium
    risk: workbench_state_contract
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
    acceptance:
      - workbench-state emits a stable JSON snapshot for managed projects
      - unmanaged folders return observable unmanaged status without claiming boot
      - project paths are redacted by default for UI privacy
      - doctor and unit tests pass

  - id: KOS-T017
    title: Add static Workbench UI shell preview
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: ui_preview_scope
    outputs:
      - examples/workbench/
      - tests/test_workbench_static.py
    acceptance:
      - static preview renders Human Layer and collapsible System Black Box
      - preview uses workbench-state schema fixture without absolute local paths
      - light and dark modes are available without external dependencies
      - doctor, static integrity tests, and unit tests pass

  - id: KOS-T018
    title: Add read-only Workbench live preview bridge
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: live_preview_scope
    outputs:
      - knowledgeos/cli.py
      - examples/workbench/
      - tests/test_workbench_static.py
    acceptance:
      - workbench-preview serves static Workbench files locally
      - live endpoint returns workbench-state JSON for the selected project
      - fixture fallback remains available for static hosting
      - preview remains read-only and does not mutate project state
      - doctor, HTTP preview tests, guardrail scenarios, and unit tests pass

  - id: KOS-T019
    title: Add read-only Intent Console sandbox
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: sandbox_runtime_boundary
    outputs:
      - knowledgeos/cli.py
      - examples/workbench/
      - tests/test_workbench_static.py
      - tests/test_knowledgeos_cli.py
      - .agent-os/tasks.yaml
    acceptance:
      - ask-sandbox provides a read-only mock runtime for natural-language intent checks
      - workbench-preview exposes a read-only sandbox endpoint without project mutation
      - Workbench UI can call the sandbox while keeping OS execution disabled by default
      - doctor resolves relative project mount paths from the selected project root
      - doctor, unit tests, HTTP preview tests, guardrail scenarios, and tool-registry checks pass

  - id: KOS-T020
    title: Add Workbench runtime adapter readiness layer
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: cli_adapter_boundary
    outputs:
      - knowledgeos/cli.py
      - examples/workbench/
      - docs/workbench-runtime-adapters.md
      - tests/test_workbench_static.py
      - tests/test_knowledgeos_cli.py
      - .agent-os/tasks.yaml
    acceptance:
      - runtime-adapters reports mock, gemini-cli, and codex-cli readiness without executing agents
      - workbench-state includes adapter readiness for UI consumption
      - Workbench UI shows adapter status separately from OS execution
      - documentation defines when actual app construction can begin
      - doctor, unit tests, HTTP preview tests, guardrail scenarios, and tool-registry checks pass

  - id: KOS-T021
    title: Add Electron Workbench desktop shell
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: desktop_shell_boundary
    outputs:
      - apps/workbench/
      - examples/workbench/styles.css
      - .agent-os/tasks.yaml
      - .agent-os/workflows/router.yaml
      - .agent-os/write-policy.yaml
    acceptance:
      - Electron shell launches the local Workbench preview bridge on 127.0.0.1
      - bridge uses port 0 and loads the actual chosen port after startup
      - closing the desktop shell terminates the bridge child process
      - desktop shell does not execute Gemini or Codex adapters
      - Workbench accent uses icy cyan rather than green
      - smoke tests and KnowledgeOS validation pass

  - id: KOS-T022
    title: Calibrate Workbench UI and add observable lifecycle
    type: route_bound_execution_guard
    status: completed
    complexity: medium
    risk: workbench_observability_boundary
    outputs:
      - knowledgeos/cli.py
      - tests/test_knowledgeos_cli.py
      - tests/test_workbench_static.py
      - examples/workbench/
      - apps/workbench/
      - docs/workbench-runtime-adapters.md
      - .agent-os/tasks.yaml
    acceptance:
      - Workbench layout uses constrained centered proportions and lower-saturation graphite/cyan colors
      - lifecycle view shows Doctor, Route, Dispatch, Write Guard, Run, Eval, and Receipt as read-only status
      - workbench-lifecycle CLI and preview endpoint return knowledgeos.workbench-lifecycle.v1
      - Ask Sandbox renders recommended OS command chain for mutation-like intents
      - app diagnose script verifies bridge, state, lifecycle, and sandbox endpoints without GUI
      - no real Gemini or Codex execution path is added
      - doctor, unit tests, guardrail scenarios, smoke, diagnose, and tool-registry checks pass

  - id: KOS-T023
    title: "Add task intake and lifecycle gates"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "guardrail_regression"
    outputs:
      - "knowledgeos/cli.py"
      - "tests/test_knowledgeos_cli.py"
      - "docs/LIVE-REPORT.md"
      - "docs/executable-control-plane.md"
      - "docs/route-bound-execution-guard.md"
      - "docs/public-release-checklist.md"
      - "docs/reset-and-migration.md"
      - "AGENTS.md"
      - ".agent-os/tasks.yaml"
      - ".agent-os/phase-policy.yaml"
      - ".agent-os/workflows/router.yaml"
      - ".agent-os/write-policy.yaml"
      - "templates/project-control-plane/AGENTS.md"
      - "templates/project-control-plane/.agent-os/startup-prompt.md"
      - "templates/project-control-plane/.agent-os/phase-policy.yaml"
      - "templates/project-control-plane/.agent-os/workflows/router.yaml"
      - "templates/project-control-plane/.agent-os/write-policy.yaml"
      - "examples/scenarios/run_guardrail_scenarios.sh"
    acceptance:
      - "create-task works for new task intake"
      - "phase-task and verify-lifecycle enforce required phases"
      - "complete-task runs required postflight or records explicit pending reason"
      - "doctor, unit tests, scenarios, and smoke pass"
  - id: KOS-T024
    title: "Audit checkpoint write-bypass paths"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "guardrail_regression"
    outputs:
      - "knowledgeos/cli.py"
      - "tests/test_knowledgeos_cli.py"
      - "docs/LIVE-REPORT.md"
      - "docs/agent-guide.md"
      - "docs/executable-control-plane.md"
      - "docs/route-bound-execution-guard.md"
      - ".agent-os/tasks.yaml"
      - ".agent-os/write-policy.yaml"
      - "templates/project-control-plane/.agent-os/write-policy.yaml"
    acceptance:
      - "manual eval markers cannot complete without command evidence"
      - "hand-written phase ledgers cannot satisfy lifecycle verification"
      - "weakened lifecycle or postflight policies are rejected"
      - "critical control-plane writes require human gate"
      - "doctor, unit tests, guardrail scenarios, smoke, diff check, and public scan pass"
  - id: KOS-T025
    title: "Add spec context pack planning gate"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "guardrail_regression"
    outputs:
      - "knowledgeos/cli.py"
      - "tests/test_knowledgeos_cli.py"
      - "docs/LIVE-REPORT.md"
      - "docs/agent-guide.md"
      - "docs/executable-control-plane.md"
      - "docs/route-bound-execution-guard.md"
      - "docs/quickstart.md"
      - "docs/public-release-checklist.md"
      - "docs/workflow-router.md"
      - "docs/architecture.md"
      - "docs/agentos-architecture.md"
      - "docs/spec-context-plan.md"
      - "README.md"
      - ".agent-os/tasks.yaml"
      - ".agent-os/specs.yaml"
      - ".agent-os/evals.yaml"
      - ".agent-os/read-policy.yaml"
      - ".agent-os/write-policy.yaml"
      - ".agent-os/workflows/router.yaml"
      - ".agent-os/startup-prompt.md"
      - "templates/project-control-plane/AGENTS.md"
      - "templates/project-control-plane/.agent-os/startup-prompt.md"
      - "templates/project-control-plane/.agent-os/specs.yaml"
      - "templates/project-control-plane/.agent-os/read-policy.yaml"
      - "templates/project-control-plane/.agent-os/write-policy.yaml"
      - "templates/project-control-plane/.agent-os/workflows/router.yaml"
      - "examples/scenarios/run_guardrail_scenarios.sh"
    acceptance:
      - "create-spec and align-spec manage durable user intent"
      - "run-task creates spec snapshot and context pack"
      - "plan-task and verify-context are required before completion"
      - "spec drift and direct spec/context/plan writes are blocked"
      - "doctor, unit tests, scenarios, smoke, diff check, and public scan pass"
  - id: KOS-T026
    title: "Merge lifecycle and spec branches into local main"
    type: "route_bound_execution_guard"
    status: completed
    complexity: "medium"
    risk: "integration_regression"
    outputs:
      - ".agent-os/tasks.yaml"
      - ".agent-os/workflows/router.yaml"
      - ".agent-os/write-policy.yaml"
      - "knowledgeos/cli.py"
      - "tests/test_knowledgeos_cli.py"
      - "tests/test_workbench_static.py"
      - "apps/workbench/"
      - "examples/workbench/"
      - "docs/workbench-runtime-adapters.md"
    acceptance:
      - "local main contains task-lifecycle-gates and spec-context-pack commits"
      - "Workbench local changes are preserved after merge"
      - "doctor, unit tests, guardrail scenarios, smoke, and Workbench diagnose pass"
