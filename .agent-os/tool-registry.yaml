# KnowledgeOS tool registry.
# This is observable configuration metadata, not an execution script.
tools:
  - id: chrome-devtools
    kind: mcp
    status: enabled
    scope: browser-automation
    invocation: capability_match
    task_fit: research_task,documentation_task,release_task
    capability_fit: browser_automation,external_docs
    human_gate: true
    source_path: templates/governance-core/mcp/servers.yaml

  - id: context7
    kind: mcp
    status: enabled
    scope: docs
    invocation: capability_match
    task_fit: capability_orchestration,documentation_task,engineering_change,research_task
    capability_fit: official_docs,external_docs
    human_gate: false
    source_path: templates/governance-core/mcp/servers.yaml

  - id: maestro
    kind: orchestrator
    status: enabled
    scope: subagent-orchestration
    invocation: medium_complex_tasks
    task_fit: capability_orchestration,executable_control_plane,engineering_change,security_audit,architecture_design
    capability_fit: subagent_orchestration,parallel_execution,expert_review
    human_gate: true
    execution_mode: ask
    source_path: external:maestro

  - id: maestro-mcp
    kind: mcp
    status: enabled
    scope: maestro-runtime-context-and-agent-methodology
    invocation: capability_match
    task_fit: capability_orchestration,executable_control_plane,engineering_change,security_audit,architecture_design,documentation_task,release_task
    capability_fit: maestro_mcp,agent_methodology,agent_catalog,runtime_context,plan_validation
    human_gate: false
    source_path: codex-config:mcp_servers.maestro
    notes: Local Codex config exposes this server as mcp_servers.maestro; tools include get_runtime_context, get_agent, get_skill_content, validate_plan, and session helpers.

  - id: maestro-accessibility-specialist
    kind: subagent
    status: recommended
    scope: maestro-specialist-agent
    invocation: via_codex_runtime_spawn_agent_with_maestro_role
    task_fit: capability_orchestration,executable_control_plane,engineering_change,architecture_design,documentation_task,release_task
    capability_fit: maestro_specialist,accessibility_specialist,read_shell
    runtime: codex
    runtime_tool: multi_agent_v1.spawn_agent
    runtime_agent_type: explorer
    adapter: maestro-codex-runtime
    adapter_role: maestro-accessibility-specialist
    human_gate: true
    execution_mode: ask
    source_path: capability-layer/subagents/maestro/maestro-accessibility-specialist.yaml
    notes: Maestro role adapter backed by Codex runtime spawn_agent; KnowledgeOS registers intent and evidence, Codex performs actual dispatch.

