write_policy:
  immutable:
    - materials/raw/**
    - data/raw/**
    - .agent-os/schemas/kernel/**

  controlled:
    - README.md
    - AGENTS.md
    - Makefile
    - bin/**
    - knowledgeos/**
    - global-agent-fabric/**
    - capability-layer/**
    - docs/**
    - archive/**
    - examples/**
    - templates/**
    - .agent-os/**
    - knowledge/**
    - src/**
    - tests/**
    - outputs/**
    - reports/drafts/**

  forbidden_without_human_gate:
    - "**/.env"
    - "**/*secret*"
    - "**/*secrets*"
    - reports/final/**
    - .agent-os/tasks.yaml
    - .agent-os/evals.yaml
    - .agent-os/read-policy.yaml
    - .agent-os/write-policy.yaml
    - .agent-os/dispatch-policy.yaml
    - .agent-os/tool-registry.yaml
    - .agent-os/workflows/router.yaml
    - .agent-os/phase-policy.yaml
    - .agent-os/fabric-link.yaml
    - .agent-os/runs/**/run.yaml
    - .agent-os/runs/**/eval.md
    - .agent-os/runs/**/phases.ndjson
    - .agent-os/runs/**/command-events.ndjson
    - .agent-os/runs/**/postflight.md
    - templates/governance-core/**
    - templates/capability-layer/**

  require_receipt_for:
    - bin/**
    - knowledgeos/**
    - global-agent-fabric/**
    - capability-layer/**
    - docs/**
    - archive/**
    - examples/**
    - templates/**
    - .agent-os/**
